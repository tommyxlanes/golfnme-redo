version: "3.9"

# The API and the worker share one image and one environment.
x-api-env: &api-env
  DATABASE_URL: postgresql://golf:${POSTGRES_PASSWORD}@pgbouncer:6432/golfnme?schema=public&pgbouncer=true&connection_limit=1
  # Signs the Bearer tokens. Defaults to NEXTAUTH_SECRET so tokens issued
  # before the API was split out stay valid.
  JWT_SECRET: ${JWT_SECRET:-${NEXTAUTH_SECRET}}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  # Extra Google client IDs (iOS / Android) allowed on /api/auth/google
  GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
  GOLF_COURSE_API_KEY: ${GOLF_COURSE_API_KEY:-}
  ABLY_API_KEY: ${ABLY_API_KEY:-}
  # Avatar uploads (Google Cloud Storage)
  GCS_BUCKET_NAME: ${GCS_BUCKET_NAME:-}
  GCS_KEY_JSON: ${GCS_KEY_JSON:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  REDIS_URL: redis://redis:6379
  NODE_ENV: ${NODE_ENV:-production}

x-web-env: &web-env
  API_URL: http://api:4000
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
  NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  NEXT_PUBLIC_ABLY_KEY: ${NEXT_PUBLIC_ABLY_KEY:-}
  NODE_ENV: ${NODE_ENV:-production}

services:
  pgbouncer:
    image: pgautofailover/pgbouncer:latest
    restart: unless-stopped
    environment:
      DATABASES_HOST: postgres
      DATABASES_PORT: 5432
      DATABASES_DBNAME: golfnme
      DATABASES_USER: golf
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD}
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: 100
      PGBOUNCER_DEFAULT_POOL_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U golf"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal
  # ───────────────────────────────────────────
  # PostgreSQL
  # ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-golf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-golfpass}
      POSTGRES_DB: ${POSTGRES_DB:-golfnme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-golf} -d ${POSTGRES_DB:-golfnme}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  # ───────────────────────────────────────────
  # Redis — BullMQ + optional Socket.io adapter
  # ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # ───────────────────────────────────────────
  # API (Hono) — the only service that talks to Postgres
  # Runs: prisma migrate deploy → tsx src/server.ts
  # ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      <<: *api-env
    ports:
      - "4000:4000"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.golfnme-api.rule=Host(`${API_DOMAIN:-api.localhost}`)"
      - "traefik.http.routers.golfnme-api.entrypoints=websecure"
      - "traefik.http.routers.golfnme-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.golfnme-api.loadbalancer.server.port=4000"

  # ───────────────────────────────────────────
  # Web UI (Next.js) — no database access, proxies /api/* to the API
  # ───────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      <<: *web-env
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - external
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:3000/login > /dev/null || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.golfnme.rule=Host(`${APP_DOMAIN:-localhost}`)"
      - "traefik.http.routers.golfnme.entrypoints=websecure"
      - "traefik.http.routers.golfnme.tls.certresolver=letsencrypt"
      - "traefik.http.services.golfnme.loadbalancer.server.port=3000"

  # ───────────────────────────────────────────
  # BullMQ Worker — same image as the API
  # Waits for api to be healthy (migrations done) before starting
  # ───────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    restart: unless-stopped
    entrypoint: ["/worker-entrypoint.sh"]
    command: ["npx", "--no-install", "tsx", "src/worker/worker.ts"]
    environment:
      <<: *api-env
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "node src/worker/health.js || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ───────────────────────────────────────────
  # Bull Board — queue dashboard (dev profile only)
  # ───────────────────────────────────────────
  bull-board:
    image: deadly0/bull-board:latest
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3001:3000"
    depends_on:
      - redis
    networks:
      - internal
    profiles:
      - dev

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
  external:
    driver: bridge
