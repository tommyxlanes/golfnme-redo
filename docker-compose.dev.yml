version: "3.9"

services:
  api:
    build:
      target: deps
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    working_dir: /app/apps/api
    environment:
      NODE_ENV: development
    entrypoint: []
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npx tsx watch src/server.ts"
    healthcheck:
      disable: true

  web:
    build:
      target: deps
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/.next
    environment:
      NODE_ENV: development
    command: npm run dev -w @golfnme/web
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_started

  worker:
    build:
      target: deps
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/api/node_modules
    working_dir: /app/apps/api
    environment:
      NODE_ENV: development
    entrypoint: []
    command: sh -c "npx prisma generate && npx tsx watch src/worker/worker.ts"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started # ← replaces service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "8081:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  bull-board:
    profiles: []
